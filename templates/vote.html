<!DOCTYPE html>
<html>
<head>
<title>Cast Your Vote</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:90%;
    max-width:550px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    border-radius:30px;
    padding:40px;
    color:white;
}

h2{text-align:center;font-size:34px;margin-bottom:8px;}
.subtitle{text-align:center;color:#dbeafe;margin-bottom:25px;font-size:15px;}

.finger-status{
    text-align:center;
    margin-bottom:20px;
    padding:10px;
    border-radius:10px;
    background:rgba(255,255,255,0.1);
}

.candidate{
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    gap:15px;
    cursor:pointer;
}

.candidate.selected{
    border:2px solid #60a5fa;
    background:rgba(96,165,250,0.18);
}

.candidate input{display:none;}

.avatar{
    width:60px;
    height:60px;
    border-radius:50%;
    background:linear-gradient(135deg,#3b82f6,#60a5fa);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
}

.btn{
    width:100%;
    padding:16px;
    margin-top:20px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#22c55e,#4ade80);
    color:white;
    font-size:18px;
    cursor:pointer;
}

.finger-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#7c3aed,#8b5cf6);
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-bottom:15px;
}

</style>

<script>

// SELECT CANDIDATE
function selectCandidate(el){
    document.querySelectorAll('.candidate')
    .forEach(c => c.classList.remove('selected'));

    el.classList.add('selected');
    el.querySelector('input').checked = true;
}

</script>

</head>

<body>

<div class="card">

<h2>🗳️ Cast Your Vote</h2>
<p class="subtitle">Select your preferred candidate</p>

<!-- FINGERPRINT STATUS FROM BACKEND -->
<div class="finger-status">
{% if fingerprint_verified %}
    ✅ Fingerprint Verified
{% else %}
    ❌ Fingerprint NOT Verified
{% endif %}
</div>

<!-- VERIFY BUTTON -->
{% if not fingerprint_verified %}
<form method="POST">
    <button class="finger-btn" type="submit" name="verify_fingerprint" value="1">
        🔒 Verify Fingerprint
    </button>
</form>
{% endif %}

<!-- VOTING FORM -->
<form method="POST">

{% for candidate in candidates %}
<div class="candidate" onclick="selectCandidate(this)">
    <input type="radio" name="candidate" value="{{ candidate[0] }}" required>

    <div class="avatar">👤</div>

    <div>
        <div style="font-size:18px;font-weight:bold;">
            {{ candidate[1] }}
        </div>
        <div style="font-size:13px;color:#dbeafe;">
            Election Candidate
        </div>
    </div>
</div>
{% endfor %}

<button class="btn" type="submit">
    ✅ Submit Vote
</button>

</form>

</div>

</body>
</html>
