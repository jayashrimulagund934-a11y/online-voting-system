```html
<!DOCTYPE html>
<html>
<head>
<title>Cast Your Vote</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:90%;
    max-width:550px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    border-radius:30px;
    padding:40px;
    color:white;
}

h2{
    text-align:center;
    font-size:34px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#dbeafe;
    margin-bottom:25px;
    font-size:15px;
}

.finger-status{
    text-align:center;
    margin-bottom:20px;
    padding:12px;
    border-radius:10px;
    background:rgba(255,255,255,0.1);
    font-weight:bold;
}

.candidate{
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    gap:15px;
    cursor:pointer;
    transition:0.3s;
}

.candidate:hover{
    background:rgba(255,255,255,0.15);
}

.candidate.selected{
    border:2px solid #60a5fa;
    background:rgba(96,165,250,0.18);
}

.candidate input{
    display:none;
}

.avatar{
    width:60px;
    height:60px;
    border-radius:50%;
    background:linear-gradient(135deg,#3b82f6,#60a5fa);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
}

.btn{
    width:100%;
    padding:16px;
    margin-top:20px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#22c55e,#4ade80);
    color:white;
    font-size:18px;
    cursor:pointer;
}

.btn:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

.finger-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#7c3aed,#8b5cf6);
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-bottom:15px;
}
</style>

<script>

let fingerprintVerified = false;

// SELECT CANDIDATE
function selectCandidate(el){
    document.querySelectorAll('.candidate')
    .forEach(c => c.classList.remove('selected'));

    el.classList.add('selected');
    el.querySelector('input').checked = true;
}

// REAL FINGERPRINT VERIFY
async function verifyFingerprint() {

    if (!window.PublicKeyCredential) {
        alert("Fingerprint authentication not supported on this device");
        return;
    }

    try {

        await navigator.credentials.get({
            publicKey: {
                challenge: new Uint8Array(32),
                timeout: 60000,
                userVerification: "required",
                allowCredentials: []
            }
        });

        fingerprintVerified = true;

        document.getElementById("finger-status").innerHTML =
        "✅ Fingerprint Verified";

        document.getElementById("voteBtn").disabled = false;

        document.getElementById("voteBtn").innerHTML =
        "✅ Submit Vote";

    } catch (error) {

        fingerprintVerified = false;

        document.getElementById("finger-status").innerHTML =
        "❌ Fingerprint NOT Verified";

        alert("Fingerprint verification failed");
    }
}

</script>

</head>

<body>

<div class="card">

<h2>🗳️ Cast Your Vote</h2>
<p class="subtitle">Select your preferred candidate</p>

<!-- FINGERPRINT STATUS -->
<div class="finger-status" id="finger-status">
❌ Fingerprint NOT Verified
</div>

<!-- VERIFY BUTTON -->
<button class="finger-btn" type="button"
onclick="verifyFingerprint()">
    🔒 Verify Fingerprint
</button>

<!-- VOTING FORM -->
<form method="POST">

{% for candidate in candidates %}
<div class="candidate" onclick="selectCandidate(this)">
    <input type="radio" name="candidate"
    value="{{ candidate[0] }}" required>

    <div class="avatar">👤</div>

    <div>
        <div style="font-size:18px;font-weight:bold;">
            {{ candidate[1] }}
        </div>

        <div style="font-size:13px;color:#dbeafe;">
            Election Candidate
        </div>
    </div>
</div>
{% endfor %}

<button class="btn" id="voteBtn"
type="submit" disabled>
    🔒 Verify Fingerprint First
</button>

</form>

</div>

</body>
</html>
```
