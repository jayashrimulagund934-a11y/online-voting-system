<!DOCTYPE html>
<html>
<head>

<title>Online Voting System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Segoe UI',sans-serif;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #2563eb
    );

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

/* MAIN CARD */

.card{

    width:90%;
    max-width:480px;

    background:
    rgba(255,255,255,0.12);

    backdrop-filter:blur(15px);

    border-radius:30px;

    padding:50px;

    text-align:center;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.4);

    color:white;

    animation:fadeIn 1s ease;
}

/* LOGO */

.emoji{

    font-size:80px;

    margin-bottom:20px;
}

/* TITLE */

h1{

    font-size:34px;

    margin-bottom:15px;
}

/* SUBTITLE */

p{

    color:#dbeafe;

    margin-bottom:35px;

    font-size:17px;
}

/* BUTTON */

.btn{

    display:inline-block;

    width:100%;

    padding:16px;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #3b82f6,
        #60a5fa
    );

    color:white;

    font-size:20px;

    font-weight:bold;

    text-decoration:none;

    transition:0.3s;
}

.btn:hover{

    transform:scale(1.04);

    box-shadow:
    0 10px 25px rgba(59,130,246,0.5);
}

/* ADMIN LINK */

.admin-link{

    display:block;

    margin-top:22px;

    color:#dbeafe;

    text-decoration:none;

    font-size:15px;
}

.admin-link:hover{

    color:white;
}

/* ANIMATION */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>

<body>

<div class="card">

<div class="emoji">
🗳️
</div>

<h1>
Online Voting System
</h1>

<p>
Secure • Fast • Digital Election Platform
</p>

<a href="/login" class="btn">
Vote Now
</a>

<a href="/admin" class="admin-link">
📊 Admin Dashboard
</a>

</div>

</body>
</html>
