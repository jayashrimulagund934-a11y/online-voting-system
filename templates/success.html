<!DOCTYPE html>
<html>
<head>

<title>Vote Submitted</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Segoe UI',sans-serif;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #2563eb
    );

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* CARD */

.card{

    width:90%;
    max-width:430px;

    background:
    rgba(255,255,255,0.12);

    backdrop-filter:blur(15px);

    border-radius:30px;

    padding:55px;

    text-align:center;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.4);

    color:white;

    animation:fadeIn 1s ease;
}

/* SUCCESS ICON */

.emoji{

    font-size:90px;

    margin-bottom:25px;

    animation:bounce 1.5s infinite;
}

/* TITLE */

h1{

    font-size:34px;

    margin-bottom:15px;
}

/* MESSAGE */

p{

    color:#dbeafe;

    margin-bottom:35px;

    font-size:16px;
}

/* BUTTON */

.btn{

    display:inline-block;

    width:100%;

    padding:16px;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #22c55e,
        #4ade80
    );

    color:white;

    text-decoration:none;

    font-size:18px;

    font-weight:bold;

    transition:0.3s;
}

.btn:hover{

    transform:scale(1.04);

    box-shadow:
    0 10px 25px rgba(34,197,94,0.5);
}

/* FADE ANIMATION */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ICON ANIMATION */

@keyframes bounce{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0);
    }
}

</style>

</head>

<body>

<div class="card">

<div class="emoji">
✅
</div>

<h1>
Vote Submitted!
</h1>

<p>
Thank you for participating in the election.
Your vote has been recorded successfully.
</p>

<a href="/" class="btn">
🏠 Go Home
</a>

</div>

</body>
</html>
