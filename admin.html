<!DOCTYPE html>
<html>
<head>
    <title>Election Results</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Segoe UI',sans-serif;

            background:
            linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #2563eb
            );

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            padding:20px;
        }

        .card{

            width:90%;
            max-width:550px;

            background:
            rgba(255,255,255,0.12);

            backdrop-filter:blur(15px);

            border-radius:25px;

            padding:40px;

            box-shadow:
            0 10px 40px rgba(0,0,0,0.4);

            color:white;

            animation:fadeIn 1s ease;
        }

        h2{

            text-align:center;

            margin-bottom:35px;

            font-size:34px;
        }

        .candidate{

            background:
            rgba(255,255,255,0.1);

            border-radius:20px;

            padding:20px;

            margin-bottom:20px;

            transition:0.3s;
        }

        .candidate:hover{

            transform:translateY(-4px);

            background:
            rgba(255,255,255,0.18);
        }

        .candidate-name{

            font-size:20px;

            font-weight:bold;

            margin-bottom:12px;
        }

        .progress-bar{

            width:100%;

            height:22px;

            background:
            rgba(255,255,255,0.2);

            border-radius:50px;

            overflow:hidden;
        }

        .progress{

            height:100%;

            border-radius:50px;

            background:
            linear-gradient(
                135deg,
                #3b82f6,
                #60a5fa
            );

            transition:width 0.5s;
        }

        .votes{

            margin-top:10px;

            color:#dbeafe;

            font-size:15px;
        }

        .btn{

            display:block;

            text-align:center;

            margin-top:25px;

            padding:15px;

            border-radius:15px;

            text-decoration:none;

            color:white;

            background:
            linear-gradient(
                135deg,
                #3b82f6,
                #2563eb
            );

            font-weight:bold;

            transition:0.3s;
        }

        .btn:hover{

            transform:scale(1.03);
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

    </style>

</head>

<body>

<div class="card">

<h2>
📊 Election Results
</h2>

{% set total = candidates|sum(attribute=2) %}

{% for candidate in candidates %}

{% set percent =
(candidate[2] / total * 100)
if total > 0 else 0 %}

<div class="candidate">

<div class="candidate-name">
👤 {{ candidate[1] }}
</div>

<div class="progress-bar">

<div class="progress"
style="width: {{ percent }}%">
</div>

</div>

<div class="votes">

{{ candidate[2] }} Votes
•
{{ "%.1f"|format(percent) }}%

</div>

</div>

{% endfor %}

<a href="/admin/edit" class="btn">
✏️ Edit Candidates
</a>

<a href="/" class="btn">
🏠 Go Home
</a>

</div>

</body>
</html>
