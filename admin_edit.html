<!DOCTYPE html>
<html>
<head>
    <title>Edit Candidates</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }

        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #fa709a;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #fa709a, #fee140);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }

        .remove-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .remove-btn:hover {
            background: #cc0000;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #999;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="card">

    <h2>✏️ Edit Candidates</h2>

    <form method="POST">

        <div class="field">

            <label>Existing Candidates</label>

            <div id="candidate-container">

                {% for candidate in candidates %}

                <div class="field">

                    <label>Candidate {{ loop.index }}</label>

                    <div class="input-row">

                        <input type="text"
                               name="name_{{ candidate[0] }}"
                               value="{{ candidate[1] }}"
                               required
                               oninput="checkLastField()">

                        <button type="submit"
                                class="remove-btn"
                                formaction="/admin/delete/{{ candidate[0] }}"
                                formmethod="POST"
                                onclick="return confirm('Remove {{ candidate[1] }}?')">
                            ✕
                        </button>

                    </div>

                </div>

                {% endfor %}

            </div>

            <button type="button"
                    class="btn"
                    onclick="addCandidateField()">

                + Add Candidate

            </button>

        </div>

        <button type="submit" class="btn">

            Save Changes ✓

        </button>

    </form>

    <a href="/admin" class="back">

        ← Back to Results

    </a>

</div>

<script>

let candidateCount = {{ candidates|length }};

function addCandidateField() {

    candidateCount++;

    const container = document.getElementById("candidate-container");

    const div = document.createElement("div");

    div.className = "field";

    div.innerHTML = `
        <label>Candidate ${candidateCount}</label>

        <div class="input-row">

            <input type="text"
                   name="new_candidate_${candidateCount}"
                   placeholder="Enter candidate name"
                   oninput="checkLastField()">

        </div>
    `;

    container.appendChild(div);
}

function checkLastField() {

    const inputs = document.querySelectorAll('#candidate-container input');

    const lastInput = inputs[inputs.length - 1];

    if (lastInput.value.trim() !== "") {

        if (!lastInput.dataset.added) {

            lastInput.dataset.added = "true";

            addCandidateField();
        }
    }
}

</script>

</body>
</html>
