<!DOCTYPE html>
<html>
<head>

<title>Login - Voting System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Segoe UI',sans-serif;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #2563eb
    );

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* MAIN CARD */

.card{

    width:90%;
    max-width:420px;

    background:
    rgba(255,255,255,0.12);

    backdrop-filter:blur(15px);

    border-radius:30px;

    padding:45px;

    text-align:center;

    box-shadow:
    0 10px 40px rgba(0,0,0,0.4);

    color:white;

    animation:fadeIn 1s ease;
}

/* ICON */

.emoji{

    font-size:70px;

    margin-bottom:20px;
}

/* TITLE */

h2{

    font-size:30px;

    margin-bottom:12px;
}

/* SUBTITLE */

p{

    color:#dbeafe;

    margin-bottom:30px;

    font-size:15px;
}

/* INPUT */

input{

    width:100%;

    padding:16px;

    border:none;

    border-radius:15px;

    font-size:16px;

    outline:none;

    margin-bottom:20px;

    background:
    rgba(255,255,255,0.9);
}

/* BUTTON */

.btn{

    width:100%;

    padding:16px;

    border:none;

    border-radius:15px;

    background:
    linear-gradient(
        135deg,
        #3b82f6,
        #60a5fa
    );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

.btn:hover{

    transform:scale(1.03);

    box-shadow:
    0 10px 25px rgba(59,130,246,0.5);
}

/* ANIMATION */

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>

<body>

<div class="card">

<div class="emoji">
📱
</div>

<h2>
Login to Vote
</h2>

<p>
Enter your phone number securely
</p>

<form method="POST">

<input
type="text"
name="phone"
placeholder="Enter 10 Digit Phone Number"
maxlength="10"
required>

<button type="submit" class="btn">
Continue →
</button>

</form>

</div>

</body>
</html>
